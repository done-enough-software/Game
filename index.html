<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-camera>

      
      
        <a-box id="target-box" class="clickable" position="0 0 0.1" scale="0.5 0.5 0.5" color="red"></a-box>
      
    </a-scene>

    <script>
      let score = 0;
      const box = document.querySelector("#target-box");

      // Simple game mechanic: click/tap the 3D object to change its color and add points
      box.addEventListener("click", () => {
        score++;
        alert("Score: " + score);
        box.setAttribute("color", score % 2 === 0 ? "red" : "green");
      });
    </script>
  </body>
</html>
