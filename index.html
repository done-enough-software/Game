<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native QR Code Scanner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      background: #1e1e1e;
      margin-top: 15px;
      display: none;
    }
    #status {
      margin-top: 20px;
      font-size: 1.05rem;
      max-width: 400px;
      word-break: break-word;
      color: #d1d5db;
    }
    button, a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 28px;
      background-color: #2563eb;
      color: white;
      border: none;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Scan a QR Code</h2>
  <button id="start-btn">Start Camera</button>
  <video id="video" autoplay playsinline></video>
  <div id="status">Tap "Start Camera" to begin scanning.</div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const video = document.getElementById("video");
    const statusDiv = document.getElementById("status");
    let stream = null;
    let scanning = false;

    startBtn.addEventListener("click", async () => {
      // Check if browser supports native BarcodeDetector
      if (!("BarcodeDetector" in window)) {
        statusDiv.textContent = "Your browser does not support built-in QR scanning. Try updating Chrome.";
        return;
      }

      statusDiv.textContent = "Requesting camera...";
      startBtn.style.display = "none";

      try {
        // Open the rear camera directly using native browser APIs
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.style.display = "block";
        statusDiv.textContent = "Point your camera at a QR code...";
        scanning = true;

        const barcodeDetector = new BarcodeDetector({ formats: ["qr_code"] });
        detectLoop(barcodeDetector);
      } catch (err) {
        startBtn.style.display = "inline-block";
        statusDiv.textContent = `Camera error: ${err.message}`;
      }
    });

    async function detectLoop(detector) {
      if (!scanning) return;

      try {
        const barcodes = await detector.detect(video);
        if (barcodes.length > 0) {
          const decodedText = barcodes[0].rawValue;
          handleResult(decodedText);
          return;
        }
      } catch (e) {
        // Ignore frame read errors while video warms up
      }

      requestAnimationFrame(() => detectLoop(detector));
    }

    function handleResult(decodedText) {
      scanning = false;
      // Stop camera stream
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.style.display = "none";
      startBtn.style.display = "inline-block";
      startBtn.textContent = "Scan Another Code";

      try {
        const url = new URL(decodedText);
        if (url.protocol === "http:" || url.protocol === "https:") {
          window.open(url.href, "_blank", "noopener,noreferrer");
          statusDiv.innerHTML = `
            <div>Scanned: <strong>${url.href}</strong></div>
            <a class="btn" href="${url.href}" target="_blank" rel="noopener noreferrer">Open Link in New Tab</a>
          `;
        } else {
          statusDiv.textContent = `Scanned non-web link: ${decodedText}`;
        }
      } catch (e) {
        statusDiv.textContent = `Scanned text: ${decodedText}`;
      }
    }
  </script>

</body>
</html>
