<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Everything inside here appears when your camera sees the lovebirds picture -->
      
        <!-- Spinning 3D Heart Container -->
        
          
          <!-- Bottom Diamond Point of the Heart -->
          <a-box position="0 -0.15 0" rotation="0 0 45" width="0.7" height="0.7" depth="0.3" color="#FF1744"></a-box>
          <!-- Left Top Lobe -->
          <a-sphere position="-0.25 0.1 0" radius="0.35" color="#FF1744"></a-sphere>
          <!-- Right Top Lobe -->
          <a-sphere position="0.25 0.1 0" radius="0.35" color="#FF1744"></a-sphere>
          
        
      
      
    </a-scene>
  </body>
</html>
