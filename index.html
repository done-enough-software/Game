<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lou's Cafe - Mobile Root Beer Defense</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border: 3px solid #ffffff;
      background-color: #2b1d14;
      image-rendering: pixelated;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 4 / 3;
    }
    #superBtn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background-color: #ffcc00;
      color: #121212;
      border: 3px solid #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    #superBtn:disabled {
      background-color: #444444;
      color: #888888;
      border-color: #666666;
    }
    #rotateWarning {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      color: #ffcc00;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
    }
    @media screen and (orientation: portrait) {
      #rotateWarning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="rotateWarning">
    <div>ROTATE YOUR PHONE HORIZONTALLY</div>
    <div style="font-size: 14px; color: #ffffff; margin-top: 10px;">Turn sideways to play in landscape mode!</div>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <button id="superBtn">SUPER MUG</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const superBtn = document.getElementById('superBtn');

    // Game constants
    const LANES = 6;
    const TOP_OFFSET = 70;
    const LANE_HEIGHT = 65;
    const COUNTER_X = 520;
    const GOAL_KILLS = 50;
    const MAX_KILLS = 99;

    // Game state
    let gameState = 'START';
    let playerLane = 2;
    let stunTimer = 0;
    let superAvailable = true;
    let kills = 0;
    let frameCount = 0;
    let spawnTimer = 0;
    let screenFlash = 0;

    // Tilt control state
    let baseTilt = null;
    let tiltCooldown = 0;

    // Entities
    let mugs = [];
    let bullies = [];
    let enemyShots = [];
    let particles = [];

    // Audio context
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(freq, type, duration, slideTo = null) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Request iOS/Android motion sensor permission on first tap
    function enableTiltControls() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', handleTilt);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleTilt);
      }
    }

    function handleTilt(event) {
      if (gameState !== 'PLAYING' || stunTimer > 0) return;
      if (tiltCooldown > 0) return;

      // In landscape mode, gamma measures forward/backward tilt
      let tilt = event.gamma;
      if (tilt === null) return;

      // Adjust for which side the phone is rotated to
      const orientation = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      if (orientation === -90 || orientation === 270) {
        tilt = -tilt;
      }

      if (baseTilt === null) {
        baseTilt = tilt;
        return;
      }

      const diff = tilt - baseTilt;
      const threshold = 10; // Degrees of tilt needed to step a lane

      if (diff > threshold && playerLane > 0) {
        playerLane--;
        tiltCooldown = 12; // Frames before next lane step
        playSound(300, 'square', 0.05);
      } else if (diff < -threshold && playerLane < LANES - 1) {
        playerLane++;
        tiltCooldown = 12;
        playSound(250, 'square', 0.05);
      }
    }

    function resetGame() {
      playerLane = 2;
      stunTimer = 0;
      superAvailable = true;
      superBtn.disabled = false;
      kills = 0;
      frameCount = 0;
      spawnTimer = 60;
      baseTilt = null; // Recalibrate neutral tilt angle on start
      mugs = [];
      bullies = [];
      enemyShots = [];
      particles = [];
      gameState = 'PLAYING';
    }
        // Tap anywhere on the screen to start or throw root beer
    function handleTap(e) {
      if (e.target === superBtn) return;
      e.preventDefault();

      if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'WIN') {
        enableTiltControls();
        resetGame();
        return;
      }

      if (gameState === 'PLAYING' && stunTimer <= 0) {
        throwMug();
      }
    }

    canvas.addEventListener('touchstart', handleTap, { passive: false });
    canvas.addEventListener('mousedown', handleTap);

    // Super Mug button tap
    superBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (gameState === 'PLAYING' && stunTimer <= 0 && superAvailable) {
        triggerSuperMug();
      }
    }, { passive: false });

    superBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (gameState === 'PLAYING' && stunTimer <= 0 && superAvailable) {
        triggerSuperMug();
      }
    });

    // Keep keyboard support just in case
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'Space', 'Enter'].includes(e.code)) {
        e.preventDefault();
      }
      if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'WIN') {
        if (e.code === 'Space' || e.code === 'Enter') resetGame();
        return;
      }
      if (gameState === 'PLAYING' && stunTimer <= 0) {
        if (e.code === 'ArrowUp' && playerLane > 0) playerLane--;
        else if (e.code === 'ArrowDown' && playerLane < LANES - 1) playerLane++;
        else if (e.code === 'Space') throwMug();
        else if (e.code === 'Enter' && superAvailable) triggerSuperMug();
      }
    });

    function throwMug() {
      if (mugs.length >= 4) return;
      mugs.push({
        x: COUNTER_X - 20,
        lane: playerLane,
        speed: 7
      });
      playSound(500, 'square', 0.1, 800);
    }

    function triggerSuperMug() {
      superAvailable = false;
      superBtn.disabled = true;
      screenFlash = 15;
      playSound(150, 'sawtooth', 0.5, 900);
      
      bullies.forEach(b => {
        createExplosion(b.x, getLaneY(b.lane), '#ffcc00');
        kills++;
      });
      bullies = [];
      enemyShots = [];

      if (kills >= MAX_KILLS) {
        kills = MAX_KILLS;
        gameState = 'WIN';
      }
    }

    function getLaneY(lane) {
      return TOP_OFFSET + lane * LANE_HEIGHT + LANE_HEIGHT / 2;
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20,
          color: color
        });
      }
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      frameCount++;
      if (stunTimer > 0) stunTimer--;
      if (screenFlash > 0) screenFlash--;
      if (tiltCooldown > 0) tiltCooldown--;

      const speedMultiplier = 1 + (kills / 45);
      const spawnRate = Math.max(30, 95 - kills);

      spawnTimer--;
      if (spawnTimer <= 0) {
        const lane = Math.floor(Math.random() * LANES);
        const isFast = kills > 15 && Math.random() < 0.3;
        bullies.push({
          x: -20,
          lane: lane,
          speed: (isFast ? 1.8 : 1.1) * speedMultiplier,
          color: isFast ? '#d32f2f' : '#388e3c',
          shootCooldown: Math.floor(Math.random() * 120) + 80
        });
        spawnTimer = spawnRate;
      }

      for (let i = mugs.length - 1; i >= 0; i--) {
        mugs[i].x -= mugs[i].speed;
        if (mugs[i].x < -20) {
          mugs.splice(i, 1);
        }
      }

      for (let i = bullies.length - 1; i >= 0; i--) {
        let b = bullies[i];
        b.x += b.speed;

        if (kills >= 10) {
          b.shootCooldown--;
          if (b.shootCooldown <= 0 && b.x < 350) {
            enemyShots.push({
              x: b.x + 20,
              lane: b.lane,
              speed: 4 * speedMultiplier
            });
            b.shootCooldown = 180;
            playSound(200, 'triangle', 0.1, 100);
          }
        }

        let hit = false;
        for (let j = mugs.length - 1; j >= 0; j--) {
          let m = mugs[j];
          if (m.lane === b.lane && Math.abs(m.x - b.x) < 25) {
            mugs.splice(j, 1);
            hit = true;
            break;
          }
        }

        if (hit) {
          createExplosion(b.x, getLaneY(b.lane), '#ffffff');
          playSound(180, 'square', 0.15, 60);
          bullies.splice(i, 1);
          kills++;
          if (kills >= MAX_KILLS) {
            gameState = 'WIN';
          }
          continue;
        }

        if (b.x >= COUNTER_X - 15) {
          playSound(100, 'sawtooth', 0.6, 40);
          if (kills >= GOAL_KILLS) {
            gameState = 'WIN';
          } else {
            gameState = 'GAMEOVER';
          }
        }
      }

      for (let i = enemyShots.length - 1; i >= 0; i--) {
        let s = enemyShots[i];
        s.x += s.speed;

        if (s.lane === playerLane && Math.abs(s.x - (COUNTER_X + 35)) < 25) {
          stunTimer = 60;
          createExplosion(COUNTER_X + 35, getLaneY(playerLane), '#ff80ab');
          playSound(120, 'sawtooth', 0.3, 50);
          enemyShots.splice(i, 1);
          continue;
        }

        if (s.x > canvas.width) {
          enemyShots.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawBackground() {
      drawPixelRect(0, 0, canvas.width, canvas.height, '#3e2723');

      for (let r = 0; r < LANES; r++) {
        const y = TOP_OFFSET + r * LANE_HEIGHT;
        drawPixelRect(0, y, COUNTER_X, LANE_HEIGHT - 4, r % 2 === 0 ? '#4e342e' : '#5d4037');
        drawPixelRect(0, y + LANE_HEIGHT - 4, COUNTER_X, 4, '#261815');
      }

      drawPixelRect(COUNTER_X, TOP_OFFSET, 24, LANES * LANE_HEIGHT, '#d7ccc8');
      drawPixelRect(COUNTER_X + 4, TOP_OFFSET, 16, LANES * LANE_HEIGHT, '#efebe9');
      drawPixelRect(COUNTER_X + 24, TOP_OFFSET, 96, LANES * LANE_HEIGHT, '#212121');

      drawPixelRect(0, 0, canvas.width, TOP_OFFSET, '#000000');
      drawPixelRect(0, TOP_OFFSET - 4, canvas.width, 4, '#ffcc00');

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText(`BULLIES: ${kills} / ${GOAL_KILLS}`, 20, 30);

      ctx.fillStyle = kills >= GOAL_KILLS ? '#4caf50' : '#aaaaaa';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText(kills >= GOAL_KILLS ? 'QUOTA MET! SURVIVE TO 99!' : 'TILT TO MOVE • TAP TO THROW', 20, 52);

      ctx.fillStyle = superAvailable ? '#ffcc00' : '#555555';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(superAvailable ? '[SUPER MUG: READY]' : '[SUPER MUG: USED]', 410, 40);
    }

    function drawPlayer() {
      const x = COUNTER_X + 35;
      const y = getLaneY(playerLane);

      if (stunTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) return;

      drawPixelRect(x - 10, y - 12, 20, 24, '#1976d2');
      drawPixelRect(x - 8, y - 12, 16, 18, '#ff5722');
      drawPixelRect(x - 8, y - 26, 16, 14, '#ffccbc');
      drawPixelRect(x - 8, y - 28, 18, 6, '#5d4037');
      if (stunTimer > 0) {
        drawPixelRect(x - 10, y - 24, 20, 12, '#f8bbd0');
      }
    }

    function drawBully(b) {
      const y = getLaneY(b.lane);
      const bob = Math.sin(frameCount * 0.2 + b.x * 0.1) * 3;

      drawPixelRect(b.x - 12, y - 14 + bob, 24, 28, b.color);
      drawPixelRect(b.x - 9, y - 28 + bob, 18, 14, '#ffccbc');
      drawPixelRect(b.x - 10, y - 30 + bob, 20, 5, '#212121');
      drawPixelRect(b.x + 2, y - 22 + bob, 6, 3, '#000000');
    }

    function drawMug(m) {
      const y = getLaneY(m.lane);
      drawPixelRect(m.x - 8, y - 10, 16, 20, '#8d6e63');
      drawPixelRect(m.x - 9, y - 14, 18, 6, '#ffffff');
      drawPixelRect(m.x + 8, y - 6, 4, 12, '#cfd8dc');
    }

    function drawEnemyShot(s) {
      const y = getLaneY(s.lane);
      drawPixelRect(s.x - 7, y - 8, 14, 16, '#f48fb1');
      drawPixelRect(s.x - 8, y - 11, 16, 4, '#ffffff');
    }

    function drawOverlay(title, subtitle, color) {
      drawPixelRect(60, 145, 520, 190, 'rgba(0, 0, 0, 0.92)');
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.strokeRect(60, 145, 520, 190);

      ctx.fillStyle = color;
      ctx.font = 'bold 32px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(title, canvas.width / 2, 205);

      ctx.fillStyle = '#ffffff';
      ctx.font = '17px "Courier New", monospace';
      ctx.fillText(subtitle, canvas.width / 2, 250);

      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('TAP SCREEN TO PLAY', canvas.width / 2, 295);
      ctx.textAlign = 'left';
    }

    function draw() {
      drawBackground();

      bullies.forEach(drawBully);
      mugs.forEach(drawMug);
      enemyShots.forEach(drawEnemyShot);
      drawPlayer();

      particles.forEach(p => {
        drawPixelRect(p.x, p.y, 4, 4, p.color);
      });

      if (screenFlash > 0) {
        drawPixelRect(0, 0, canvas.width, canvas.height, 'rgba(255, 255, 255, 0.6)');
      }

      if (gameState === 'START') {
        drawOverlay("LOU'S CAFE", "TILT PHONE TO MOVE • TAP TO THROW", "#ffcc00");
      } else if (gameState === 'GAMEOVER') {
        drawOverlay("THROWN OUT!", `YOU ONLY GOT ${kills} / ${GOAL_KILLS} BULLIES`, "#f44336");
      } else if (gameState === 'WIN') {
        drawOverlay("STAGE CLEAR!", `FINAL SCORE: ${kills} BULLIES STOPPED!`, "#4caf50");
      }
    }

    function gameLoop() {
      update();
      draw();
