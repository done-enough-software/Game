<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Swarm - Done Enough Software</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a14;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }
    canvas {
      background: #0d1021;
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 20px rgba(0, 255, 170, 0.15);
    }
  </style>
</head>
<body>
<canvas id="game" width="360" height="640"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const SPRITES = {
  player: [
    "00000100000",
    "00001210000",
    "00001110000",
    "00101110100",
    "00111211100",
    "01111111110",
    "11211111211",
    "11011011011"
  ],
  // Jagged Crystal Diamond
  alienTop: [
    "0000110000",
    "0001221000",
    "0012112100",
    "0121111210",
    "0012112100",
    "0001221000",
    "0000110000"
  ],
  // Twin-Winged Fighter Drone
  alienMid: [
    "1100000011",
    "1110110111",
    "1111221111",
    "1101111011",
    "1000110001",
    "0000110000",
    "0000000000"
  ],
  // Chunky Space Asteroid
  alienBot: [
    "0011111000",
    "0111211100",
    "1121111110",
    "1111121111",
    "0111111210",
    "0011211100",
    "0001110000"
  ]
};



let state = 'START';
let score = 0;
let highScore = parseInt(localStorage.getItem('cosmicSwarmBest')) || 0;
let wave = 1;
let lives = 3;

const player = { x: 163, y: 580, w: 33, h: 24, lastShot: 0 };
let bullets = [];
let enemyBullets = [];
let aliens = [];
let shields = [];
let particles = [];
let stars = Array.from({length: 40}, () => ({
  x: Math.random() * 360,
  y: Math.random() * 640,
  s: Math.random() * 1.5 + 0.5
}));

let alienDir = 1;
let alienSpeed = 0.45;
let tiltGamma = 0;
let touchX = null;

window.addEventListener('deviceorientation', (e) => {
  if (e.gamma !== null) tiltGamma = e.gamma;
});

function drawSprite(grid, x, y, scale, c1, c2) {
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const val = grid[r][c];
      if (val === '0') continue;
      ctx.fillStyle = val === '1' ? c1 : c2;
      ctx.fillRect(Math.floor(x + c * scale), Math.floor(y + r * scale), scale, scale);
    }
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      life: 20,
      color
    });
  }
}

function initWave() {
  aliens = [];
  bullets = [];
  enemyBullets = [];
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 7; c++) {
      let type = r === 0 ? 'alienTop' : (r < 3 ? 'alienMid' : 'alienBot');
      let c1 = r === 0 ? '#ff4d6d' : (r < 3 ? '#00f5d4' : '#fee440');
      let pts = r === 0 ? 30 : (r < 3 ? 20 : 10);
      aliens.push({ x: 28 + c * 44, y: 80 + r * 36, w: 30, h: 21, type, c1, pts });
    }
  }
  alienDir = 1;
  alienSpeed = 0.4 + (wave * 0.12);
}
function initShields() {
  shields = [];
  const positions =;
  positions.forEach(sx => {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 6; c++) {
        if (r === 3 && (c === 2 || c === 3)) continue;
        shields.push({ x: sx + c * 8, y: 515 + r * 8, w: 8, h: 8, hp: 2 });
      }
    }
  });
}


function startGame() {
  score = 0;
  wave = 1;
  lives = 3;
  player.x = 163;
  player.lastShot = performance.now();
  initShields();
  initWave();
  state = 'PLAY';
}

function handlePointer(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  touchX = (e.clientX - rect.left) * scaleX;
}

canvas.addEventListener('pointerdown', async (e) => {
  if (state !== 'PLAY') {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (err) {}
    }
    startGame();
    return;
  }
  handlePointer(e);
});

canvas.addEventListener('pointermove', (e) => {
  if (state === 'PLAY' && e.buttons > 0) handlePointer(e);
});
canvas.addEventListener('pointerup', () => { touchX = null; });

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(now) {
  stars.forEach(st => {
    st.y += st.s;
    if (st.y > 640) { st.y = 0; st.x = Math.random() * 360; }
  });

  if (state !== 'PLAY') return;

  if (Math.abs(tiltGamma) > 2) {
    const clampedTilt = Math.max(-30, Math.min(30, tiltGamma));
    player.x += (clampedTilt / 30) * 7.5;
  } else if (touchX !== null) {
    const targetX = touchX - player.w / 2;
    player.x += (targetX - player.x) * 0.25;
  }
  player.x = Math.max(8, Math.min(canvas.width - player.w - 8, player.x));

  if (now - player.lastShot >= 1000) {
    bullets.push({ x: player.x + 15, y: player.y - 8, w: 3, h: 10 });
    player.lastShot = now;
  }

  bullets.forEach(b => b.y -= 8);
  bullets = bullets.filter(b => b.y > -10);

  let hitEdge = false;
  const speedBoost = 1 + (35 - aliens.length) * 0.035;
  aliens.forEach(a => {
    a.x += alienDir * alienSpeed * speedBoost;
    if (a.x <= 8 || a.x + a.w >= canvas.width - 8) hitEdge = true;
  });

  if (hitEdge) {
    alienDir *= -1;
    aliens.forEach(a => {
      a.y += 14;
      if (a.y + a.h >= player.y) state = 'GAMEOVER';
    });
  }

  if (aliens.length > 0 && Math.random() < 0.015 + wave * 0.004) {
    const shooter = aliens[Math.floor(Math.random() * aliens.length)];
    enemyBullets.push({ x: shooter.x + 14, y: shooter.y + 20, w: 4, h: 10 });
  }

  enemyBullets.forEach(eb => eb.y += 3.8 + wave * 0.25);
  enemyBullets = enemyBullets.filter(eb => eb.y < 650);

  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = aliens.length - 1; j >= 0; j--) {
      if (rectHit(bullets[i], aliens[j])) {
        score += aliens[j].pts;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('cosmicSwarmBest', highScore);
        }
        createParticles(aliens[j].x + 15, aliens[j].y + 10, aliens[j].c1);
        aliens.splice(j, 1);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  [bullets, enemyBullets].forEach(list => {
    for (let i = list.length - 1; i >= 0; i--) {
      for (let j = shields.length - 1; j >= 0; j--) {
        if (rectHit(list[i], shields[j])) {
          shields[j].hp--;
          if (shields[j].hp <= 0) shields.splice(j, 1);
          list.splice(i, 1);
          break;
        }
      }
    }
  });

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    if (rectHit(enemyBullets[i], player)) {
      enemyBullets.splice(i, 1);
      lives--;
      createParticles(player.x + 16, player.y + 12, '#00ffaa');
      if (lives <= 0) state = 'GAMEOVER';
    }
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (aliens.length === 0) { wave++; initWave(); }
}

function draw() {
  ctx.fillStyle = '#0d1021';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#4a5588';
  stars.forEach(st => ctx.fillRect(Math.floor(st.x), Math.floor(st.y), 2, 2));

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE:${score}`, 12, 26);
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE:${wave}`, 180, 26);
  ctx.textAlign = 'right';
  ctx.fillText(`BEST:${highScore}`, 348, 26);

  if (state === 'START') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f5d4';
    ctx.font = 'bold 32px monospace';
    ctx.fillText('COSMIC SWARM', 180, 230);

    drawSprite(SPRITES.alienTop, 110, 265, 3, '#ff4d6d', '#fff');
    drawSprite(SPRITES.alienMid, 165, 265, 3, '#00f5d4', '#fff');
    drawSprite(SPRITES.alienBot, 220, 265, 3, '#fee440', '#fff');

    ctx.fillStyle = '#ffffff';
    ctx.font = '15px monospace';
    ctx.fillText('TILT PHONE TO STEER', 180, 340);
    ctx.fillText('CANNON FIRES EVERY 1 SEC', 180, 365);

    ctx.fillStyle = '#fee440';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('[ TAP TO START ]', 180, 430);

    ctx.fillStyle = '#6c759c';
    ctx.font = '12px monospace';
    ctx.fillText('DONE ENOUGH SOFTWARE', 180, 610);
    return;
  }

  shields.forEach(s => {
    ctx.fillStyle = s.hp === 2 ? '#00ffaa' : '#008855';
    ctx.fillRect(s.x, s.y, s.w - 1, s.h - 1);
  });

  if (lives > 0) drawSprite(SPRITES.player, player.x, player.y, 3, '#00ffaa', '#ffffff');

  aliens.forEach(a => drawSprite(SPRITES[a.type], a.x, a.y, 3, a.c1, '#ffffff'));

  ctx.fillStyle = '#00ffaa';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  ctx.fillStyle = '#ff4d6d';
  enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 3, 3);
  });

  for (let i = 0; i < lives; i++) {
    drawSprite(SPRITES.player, 12 + i * 24, 616, 1.8, '#00ffaa', '#fff');
  }

  if (state === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(9, 10, 20, 0.82)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 34px monospace';
    ctx.fillText('GAME OVER', 180, 260);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, 180, 310);
    ctx.fillText(`BEST SCORE: ${highScore}`, 180, 340);

    ctx.fillStyle = '#fee440';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('[ TAP TO PLAY AGAIN ]', 180, 410);
  }
}

function loop(now) {
  update(now);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
