<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <!-- More reliable CDN for html5-qrcode -->
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      overflow: hidden;
      background: #1e1e1e;
      margin-top: 15px;
    }
    #status {
      margin-top: 20px;
      font-size: 1.05rem;
      max-width: 400px;
      word-break: break-word;
      color: #d1d5db;
    }
    button, a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 28px;
      background-color: #2563eb;
      color: white;
      border: none;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:active, a.btn:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <h2>Scan a QR Code</h2>
  <button id="start-btn">Start Camera</button>
  <div id="reader"></div>
  <div id="status">Tap "Start Camera" to begin scanning.</div>

  <script>
    const startBtn = document.getElementById("start-btn");
    const statusDiv = document.getElementById("status");
    let html5QrCode;
    let isScanning = false;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;

      try {
        const url = new URL(decodedText);
        if (url.protocol === "http:" || url.protocol === "https:") {
          isScanning = false;
          html5QrCode.stop().then(() => {
            startBtn.style.display = "inline-block";
            startBtn.textContent = "Scan Another Code";
          });

          // Try opening in a new tab
          window.open(url.href, "_blank", "noopener,noreferrer");

          // Show fallback button in case Chrome blocks automatic pop-ups
          statusDiv.innerHTML = `
            <div>Scanned: <strong>${url.href}</strong></div>
            <a class="btn" href="${url.href}" target="_blank" rel="noopener noreferrer">Open Link in New Tab</a>
          `;
        } else {
          statusDiv.textContent = `Scanned non-web link: ${decodedText}`;
        }
      } catch (e) {
        statusDiv.textContent = `Scanned text: ${decodedText}`;
      }
    }

    startBtn.addEventListener("click", async () => {
      if (typeof Html5Qrcode === "undefined") {
        statusDiv.textContent = "Error: Scanner library failed to load. Check your internet connection.";
        return;
      }

      statusDiv.textContent = "Requesting camera access...";
      startBtn.style.display = "none";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      try {
        isScanning = true;
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess
        );
        statusDiv.textContent = "Point your camera at a QR code...";
      } catch (err) {
        isScanning = false;
        startBtn.style.display = "inline-block";
        statusDiv.textContent = `Camera error: ${err}. Make sure Chrome has camera permission in your phone settings.`;
      }
    });
  </script>

</body>
</html>
