<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json" />
  <script>
    const s = document.createElement("script");
    s.src = ["https://cdn", "onesignal", "com/sdks/web/v16/OneSignalSDK", "page", "js"].join(".");
    s.defer = true;
    document.head.appendChild(s);
  </script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "a812b43c-b985-4c58-aed9-b7c2307a87c9",
          safari_web_id: "web.onesignal.auto.38b1a4de-a361-440e-ae28-b7c05790af2",
          serviceWorkerParam: { scope: "/Game/" },
          serviceWorkerPath: "/Game/OneSignalSDKWorker.js"
        });
        document.getElementById("status").innerText = "Ready! Tap the button.";
      } catch (err) {
        document.getElementById("status").innerText = "Init Error: " + err.message;
      }
    });


    OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "a812b43c-b985-4c58-aed9-b7c2307a87c9",
    safari_web_id: "web.onesignal.auto.38b1a4de-a361-440e-ae28-b71c05790af2",
    serviceWorkerParam: { scope: "/Game/" },
    serviceWorkerPath: "/Game/OneSignalSDKWorker.js"
  });

  // Runs automatically when a player taps the notification
  OneSignal.Notifications.addEventListener("click", function(event) {
    const title = event.notification.title || "Game Alert";
    const body = event.notification.body || "";
    alert(title + "\n\n" + body);
  });
});
    
  </script>
  <style>
    body {
      display: flex;

      margin: 0;

    button {
      font-size: 24px;
      padding: 20px 40px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <button onclick="subscribeMe()">Enable Notifications</button>
  <div id="status">Loading OneSignal...</div>

  <script>
    function subscribeMe() {
      document.getElementById("status").innerText = "Button clicked...";
      window.OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          document.getElementById("status").innerText = "Permission: " + Notification.permission;
        } catch (err) {
          document.getElementById("status").innerText = "Click Error: " + err.message;
        }
      });
    }
  </script>
</body>
