<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #status {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.85);
        color: #00ff00;
        font-family: sans-serif;
        font-size: 15px;
        padding: 12px;
        border-radius: 8px;
        z-index: 9999;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Checking targets.mind file...</div>

    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-box color="#00FF00" position="0 0 0.15" scale="0.4 0.4 0.4"></a-box>
      
    </a-scene>

    <script>
      const statusBox = document.getElementById("status");
      const sceneEl = document.getElementById("ar-scene");
      const targetEl = document.getElementById("mug-target");

      window.onerror = (msg) => {
        statusBox.textContent = "Error: " + msg;
        statusBox.style.color = "#ff4444";
      };

      fetch("./targets.mind")
        .then((res) => {
          if (!res.ok) throw new Error("targets.mind missing (HTTP " + res.status + ")");
          statusBox.textContent = "targets.mind found! Starting camera...";
        })
        .catch((err) => {
          statusBox.textContent = err.message;
          statusBox.style.color = "#ff4444";
        });

      sceneEl.addEventListener("arReady", () => {
        statusBox.textContent = "AR Ready! Point camera at the mug.";
      });

      sceneEl.addEventListener("arError", (e) => {
        statusBox.textContent = "AR Error: " + JSON.stringify(e.detail);
        statusBox.style.color = "#ff4444";
      });

      targetEl.addEventListener("targetFound", () => {
        statusBox.textContent = "MUG FOUND!";
      });

      targetEl.addEventListener("targetLost", () => {
        statusBox.textContent = "Scanning for mug...";
      });
    </script>
  </body>
</html>
